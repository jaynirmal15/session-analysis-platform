# LiveKit development configuration.
#
# Development credentials only. These keys are intentionally committed so that
# `docker compose up` works with no setup; they must never be used anywhere a
# real client can reach. LiveKit requires an API secret of at least 32
# characters.
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false

# Scraped by Prometheus as the `livekit` job. Gives the local stack real
# metrics to display before the ingester produces any of its own.
prometheus_port: 6789

keys:
  devkey: devsecretdevsecretdevsecretdevsecret

webhook:
  api_key: devkey
  urls:
    # TODO(scope): this route does not exist yet. The webhook receiver is
    # unimplemented, so LiveKit will get a 404 for any lifecycle event and
    # retry. That is expected during scaffolding, and only happens once a
    # client actually connects to a room.
    - http://ingester:8080/webhook/livekit

logging:
  level: info
  json: false
