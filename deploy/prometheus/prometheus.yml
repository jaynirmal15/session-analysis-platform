global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: session-analysis-platform-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics, forwarded by the collector's Prometheus exporter.
  # Both the containerised ingester and a host process started by
  # `make run-local` arrive through here.
  - job_name: otel-collector-pipeline
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health. Worth having: it is the single point through
  # which every application metric passes.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]
