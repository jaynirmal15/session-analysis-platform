name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build -trimpath ./...

      - name: test
        run: go test -race -count=1 ./...

  integration:
    name: integration (real postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sap
          POSTGRES_PASSWORD: sap
          POSTGRES_DB: sap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sap -d sap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The partition-miss classifier distinguishes two errors PostgreSQL
      # itself produces. A fixture asserting what we believe those errors look
      # like would test the belief, so these run against a real server.
      - name: apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/migrations:ro" \
            migrate/migrate:v4.19.0 \
            -path=/migrations \
            -database "postgres://sap:sap@127.0.0.1:5432/sap?sslmode=disable" up

      - name: integration tests
        env:
          SAP_TEST_DATABASE_URL: postgres://sap:sap@127.0.0.1:5432/sap?sslmode=disable
        run: go test -tags integration -count=1 ./...

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cheap guard against the local stack rotting: the compose file and the
      # Dockerfiles must at least remain valid and buildable. Actually running
      # the stack in CI is deferred until there is behaviour worth asserting.
      - name: validate compose file
        run: docker compose config -q

      - name: build service images
        run: docker compose build ingester queryapi
